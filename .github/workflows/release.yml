# The Windows installers and a portable zip (the program and its notices, to
# run where it is unpacked): by hand (Actions > Release > Run workflow) to try
# a build, or by pushing a tag vX.Y.Z, which also drafts a release with them.
# The draft waits for the core's tests on Windows; the build does not.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p hu-core -p hu-diff --release

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: The tag, the version and the change log agree
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but Cargo.toml says $version."
            exit 1
          fi
          if ! grep -q "^## \[$version\] - [0-9]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated section for $version."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: app
      - run: npx tauri build
        working-directory: app
      - name: The installers, and the portable zip beside them
        shell: bash
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          mkdir out portable
          cp target/release/bundle/nsis/*.exe target/release/bundle/msi/*.msi out/
          # The notices are read from beside the program, as from the install folder.
          cp target/release/hu-editor.exe "portable/HU Editor.exe"
          cp app/src-tauri/THIRD_PARTY_NOTICES.txt portable/
          (cd portable && 7z a "../out/HU Editor_${version}_x64-portable.zip" *)
      - uses: actions/upload-artifact@v7
        with:
          name: hu-editor-windows
          if-no-files-found: error
          path: out/

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: hu-editor-windows
          path: installers
      - name: Draft the release, its notes from the change log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## [$version]" 'index($0, "## [") == 1 { on = index($0, head) == 1; next } on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --draft --title "HU Editor $GITHUB_REF_NAME" --notes-file notes.md installers/*
